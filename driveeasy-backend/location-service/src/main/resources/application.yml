server:
  port: 8083

spring:
  application:
    name: location-service
  config:
    import: "optional:configserver:http://localhost:8888"

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

driveeasy:
  tarification:
    remise-standard: 0.00
    remise-fidele: 0.05
    remise-vip: 0.10
    facteur-penalite-retard: 1.50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
